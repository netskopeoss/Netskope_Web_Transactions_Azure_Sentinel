- assertions:
  - fieldsHaveValues:
      Vendor.alert_name: 'Combolist: ''Netflix.txt'' (11,680 Records)'
      Vendor.ur_normalized: nilay.modi@crestdata.ai
      Vendor.count: '1'
      Vendor.cci: '88'
      Vendor._id: 45ce99ef803351a401db40ac
      event.category[1]: network
      Vendor.breach_date: '1737072000'
      Vendor.breach_id: '79498'
      event.type[0]: indicator
      Vendor.category: Application Suite
      Vendor.timestamp: '1740395771'
      Vendor.type: breach
      Vendor.record_type: alert
      Vendor.email_source: Client
      '#event.kind': alert
      Vendor.user: nilay.modi@crestdata.ai
      Vendor.userkey: nilay.modi@crestdata.ai
      Vendor.alert: 'yes'
      event.category[0]: threat
      Vendor.external_email: '1'
      event.type[1]: info
      Vendor.acked: 'false'
      Vendor.breach_description: A plain text 'combolist' file titled 'Netflix.txt'
        was acquired by ZeroFox from a publicly accessible source. Combolists traditionally
        consist of compromised login credentials in the form of email addresses or
        usernames, and accompanying plain-text passwords. They are often compiled
        by threat actors from a variety of sources, including leaked databases and
        other combolists, to be used in attacks such as credential stuffing, password
        spraying and account takeover. These attacks can present significant risk
        to users where they frequently use the same password across multiple accounts,
        or who have failed to change their credentials following a potential data
        breach of services they use. ZeroFox emphasizes that threat actors often misrepresent
        the authenticity of published combolists, and in some cases randomly generate
        or falsify username and password pairs. From this package, ZeroFox extracted
        11,680 usernames. Of these, 11,680 records included a password.
      Vendor.matched_username: jenisdonda012@example.com
      Vendor.alert_type: Compromised Credential
      network.application: google accounts
      Vendor.ccl: high
      Vendor.app: Google Accounts
      user.name: nilay.modi@crestdata.ai
    outputEventIndex: 0
  event:
    rawString: |-
      {
                  "_id": "45ce99ef803351a401db40ac",
                  "acked": "false",
                  "alert": "yes",
                  "alert_name": "Combolist: 'Netflix.txt' (11,680 Records)",
                  "alert_type": "Compromised Credential",
                  "app": "Google Accounts",
                  "breach_date": 1737072000,
                  "breach_description": "A plain text 'combolist' file titled 'Netflix.txt' was acquired by ZeroFox from a publicly accessible source. Combolists traditionally consist of compromised login credentials in the form of email addresses or usernames, and accompanying plain-text passwords. They are often compiled by threat actors from a variety of sources, including leaked databases and other combolists, to be used in attacks such as credential stuffing, password spraying and account takeover. These attacks can present significant risk to users where they frequently use the same password across multiple accounts, or who have failed to change their credentials following a potential data breach of services they use. ZeroFox emphasizes that threat actors often misrepresent the authenticity of published combolists, and in some cases randomly generate or falsify username and password pairs. From this package, ZeroFox extracted 11,680 usernames. Of these, 11,680 records included a password.",
