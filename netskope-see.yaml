.email_from_user","Vendor.from_user","Vendor.app-gdpr-level","Vendor.usergroup","Vendor.device_type","Vendor.hostname","Vendor.dinsid","Vendor.incident_id","Vendor.latest_incident_id","Vendor.instance_id","Vendor.instance","Vendor.instance_name","Vendor.sanctioned_instance","Vendor.ip_protocol","Vendor.dst_latitude","Vendor.src_latitude","Vendor.local_md5","Vendor.local_sha1","Vendor.local_sha256","Vendor.loc","Vendor.location","Vendor.src_location","Vendor.dst_longitude","Vendor.src_longitude","Vendor.mal_id","Vendor.malware_id","Vendor.mal_sev","Vendor.malware_severity","Vendor.mal_type","Vendor.malware_type","Vendor.managed_app","Vendor.managementID","Vendor.vendor_id","Vendor.md5","Vendor.message_id","Vendor.mime_type","Vendor.tss_mode","Vendor.product_id","Vendor.modified_date","Vendor.src_network","Vendor.network_session_id","Vendor.ur_normalized","Vendor.oauth","Vendor.object","Vendor.object_id","Vendor.owner","Vendor.object_type","Vendor.org","Vendor.organization_unit","Vendor.os","Vendor.os_details","Vendor.os_family","Vendor.os_user_name","Vendor.os_version","Vendor.page","Vendor.parent_id","Vendor.owner_pdl","Vendor.policy_name_enforced","Vendor.policy","Vendor.policy_version","Vendor.pop_id","Vendor.netskope_pop","Vendor.port","Vendor.web_url","Vendor.connection_type","Vendor.process_name","Vendor.process_cert_subject","Vendor.pid","Vendor.process_path","Vendor.publisher_cn","Vendor.domain_ip","Vendor.redirect_url","Vendor.referer","Vendor.region_name","Vendor.src_region","Vendor.region_id","Vendor.iaas_remediated","Vendor.iaas_remediation_action","Vendor.iaas_remediated_by","Vendor.iaas_remediated_on","Vendor.req","Vendor.req_cnt","Vendor.request_id","Vendor.resource_category","Vendor.resource_group","Vendor.resp","Vendor.resp_cnt","Vendor.risk_level_id","Vendor.sa_profile_name","Vendor.sa_rule_compliance","Vendor.sa_rule_name","Vendor.sa_rule_severity","Vendor.sender","Vendor.session_duration","Vendor.session_number_unique","Vendor.serverity","Vendor.severity_level","Vendor.severity_id","Vendor.shared_with","Vendor.shared_domains","Vendor.tunnel_id","Vendor.smtp_status","Vendor.smtp_to","Vendor.src_geoip_src","Vendor.srcip","Vendor.srcport","Vendor.conn_starttime","Vendor.start_time","Vendor.status","Vendor.subject","Vendor.tags","Vendor.telemetry_app","Vendor.threat_type","Vendor.timestamp","Vendor.src_timezone","Vendor.to_user","Vendor.numbytes","Vendor.traffic_type","Vendor.transaction_id","Vendor.tss_license","Vendor.two_factor_auth","Vendor.type","Vendor.unc_path","Vendor.nsdeviceuid","Vendor.url","Vendor.user","Vendor.useragent","Vendor.user_confidence_index","Vendor.user_confidence_level","Vendor.user_id","Vendor.userip","Vendor.userkey","Vendor.violation","Vendor.site","Vendor.src_zipcode","Vendor.account_id","Vendor.alert_id","Vendor.appact","Vendor.audit_type","Vendor.response_time","Vendor.email_modified","Vendor.email_title","Vendor.subtype","Vendor.event_uuid","Vendor.file_cls_encrypted","Vendor.fllg","Vendor.file_pdl","Vendor.local_source_time","Vendor.server_packets","Vendor.client_packets","Vendor.flpp","Vendor.risk_score","Vendor.suppression_count","Vendor.spet","Vendor.spst","Vendor.thr","Vendor.email_user","Vendor.tur","Vendor.total_packets","Vendor.num_users","Vendor.watchlist_name","Vendor.custom_attr","Vendor.record_type"], delimiter=" ", excludeEmpty=true)
  }
  | drop([__str])
  // API-SecOps webhooks (case.*, risk.*) wrap the whole envelope in an extra
  // top-level "data" key: {"data": {id, type, timestamp, tenant_id, region,
  // api_version, data: {...case/risk fields...}}}. __type resolves the type
  // regardless of whether it shows up unwrapped (Vendor.type) or wrapped one
  // level deep (Vendor.data.type, the confirmed real webhook shape).
  | __type := coalesce([Vendor.type, Vendor.data.type])
  | case {
      // Already have an explicit type - nothing to infer.
      __type = *
          | *;
      // No explicit type anywhere (e.g. a bare "data" object with no
      // wrapper at all) - infer it from the field combination that's
      // unique to each case/risk event so it can still be routed below.
      Vendor.case_id = * OR Vendor.data.data.case_id = *
          | case {
              Vendor.old_status = * OR Vendor.data.data.old_status = *
                  | __type := "case.status.changed";
              Vendor.assignee = * OR Vendor.data.data.assignee = *
                  | __type := "case.assigned";
              Vendor.error = * OR Vendor.data.data.error = *
                  | __type := "case.investigation.failed";
              Vendor.verdict = * OR Vendor.data.data.verdict = *
                  | __type := "case.investigation.completed";
              *
                  | __type := "case.created";
          };
      Vendor.risk_indicators.total = * OR Vendor.previous_uci = * OR Vendor.data.data.risk_indicators.total = * OR Vendor.data.data.previous_uci = *
          | case {
              Vendor.previous_band = * OR Vendor.data.data.previous_band = *
                  | __type := "risk.user.threshold_exceeded";
              *
                  | __type := "risk.user.investigation.completed";
          };
      Vendor.scored_at = * OR Vendor.data.data.scored_at = *
          | case {
              Vendor.mcp_server_id = * OR Vendor.data.data.mcp_server_id = *
                  | case {
                      Vendor.previous_band = * OR Vendor.data.data.previous_band = *
                          | __type := "risk.ai_mcp.threshold_exceeded";
                      Vendor.primary_driver = * OR Vendor.data.data.primary_driver = *
                          | __type := "risk.ai_mcp.investigation.completed";
                      *
                          | __type := "risk.ai_mcp.scored";
                  };
              Vendor.app_id = * OR Vendor.data.data.app_id = *
                  | case {
                      Vendor.previous_band = * OR Vendor.data.data.previous_band = *
                          | __type := "risk.ai_app.threshold_exceeded";
                      Vendor.primary_driver = * OR Vendor.data.data.primary_driver = *
                          | __type := "risk.ai_app.investigation.completed";
                      *
                          | __type := "risk.ai_app.scored";
                  };
              Vendor.user_id = * OR Vendor.data.data.user_id = *
                  | case {
                      Vendor.previous_band = * OR Vendor.data.data.previous_band = *
                          | __type := "risk.ai_user.threshold_exceeded";
                      Vendor.primary_driver = * OR Vendor.data.data.primary_driver = *
                          | __type := "risk.ai_user.investigation.completed";
                      *
                          | __type := "risk.ai_user.scored";
                  };
              *;
          };
      *;
  }
  | Vendor.timestamp := coalesce([Vendor.timestamp, Vendor.data.timestamp, Vendor.data.created_at, Vendor.created_at, Vendor.data.data.created_at, Vendor.data.scored_at, Vendor.scored_at, Vendor.data.data.scored_at])
  | case {
      // epoch seconds (existing WebTx CSV/JSON formats)
      Vendor.timestamp = /^[0-9.]+$/
          | parseTimestamp(field="Vendor.timestamp", format="seconds");
      // ISO8601 string (API-SecOps case.*/risk.* events)
      Vendor.timestamp = *
          | parseTimestamp(field="Vendor.timestamp");
      // no Vendor.timestamp to parse (e.g. empty/unrecognized rawstring) - skip and keep ingest time
      *;
  }
  // #endregion

  // #region METADATA
  /************************************************************
  ****** Static Metadata Definitions
  ************************************************************/
  | Parser.version := "4.0.1"
  | Vendor := "netskope"
  | event.module := "sse"
  | ecs.version := "9.2.0"
  | Cps.version := "1.1.0"
  | event.kind := "event"
  // #endregion

  // #region NORMALIZATION
  /************************************************************
  ****** Parse unstructured data (i.e. message field)
  ****** Normalize fields to data model
  ************************************************************/

  // Event Categorization
  | case {
      Vendor.alert = "yes" OR Vendor.kind = "incident" OR Vendor.kind = "alert" OR Vendor.record_type = "alert" OR Vendor.record_type = "incident"
          | case {
              Vendor.action =~ !in(values=["block", "bypass", "quarantine"])
                  | threat.indicator.ip := Vendor.userip
                  | event.kind := "alert"
                  | array:append("event.category[]", values=["threat", "network"])
                  | array:append("event.type[]", values=["indicator", "info"]);
              *
                  | array:append("event.category[]", values=["network"])
                  | array:append("event.type[]", values=["info"]);

          }
          | case {
              Vendor.object_type = "File"
                  | array:append("event.category[]", values=["file"])
                  | array:append("threat.technique.subtechnique.id[]", values="T1204.002");
              Vendor.alert_type = "malsite" OR Vendor.alert_name = "*Malsites*"
                  | array:append("threat.technique.subtechnique.id[]", values="T1204.001");
              *;
          };
      Vendor.object_type = /network/
          | array:append(array="event.category[]", values=["network","configuration"])
          | case {
              event.action = "create"
                  | array:append(array="event.type[]", values=["creation"]);

              event.action = "delete"
                  | array:append(array="event.type[]", values=["deletion"]);

              event.action = "edit"
                  | array:append(array="event.type[]", values=["change"]);

              *;

          };
      event.action = /^login (attempt|failed)/
          | array:append("event.category[]", values=["authentication"])
          | array:append("event.type[]", values=["start"])
          | event.outcome := "failure";
      event.action = /^login successful/
          | array:append("event.category[]", values=["authentication"])
          | array:append("event.type[]", values=["start"])
          | event.outcome := "success";
      Vendor.kind=/(page)|(network)|(endpoint)/ OR Vendor.record_type=/(page)|(network)|(endpoint)/
          | array:append("event.category[]", values=["network"])
          | array:append("event.type[]", values=["connection"])
          | case {
              Vendor.action = /allow/
                  | array:append("event.type[]", values=["allowed"]);
              *
                  | array:append("event.type[]", values=["denied"]);
          };
      Vendor.kind = "audit" OR Vendor.record_type = "audit"
          | array:append("event.category[]", values=["configuration"])
          | array:append("event.type[]", values=["admin"]);
      Vendor.kind = "application" OR Vendor.record_type = "application"
          | array:append("event.category[]", values=["file"])
          | array:append("event.type[]", values=["info"]);
      *;

  }

  // API-SecOps Case & Risk Events
  | case {
      __type = "case.created"
          | event.kind := "alert"
          | array:append("event.category[]", values=["intrusion_detection"])
          | array:append("event.type[]", values=["creation"]);
      __type = "case.status.changed" OR __type = "case.assigned"
          | event.kind := "event"
          | array:append("event.category[]", values=["intrusion_detection"])
          | array:append("event.type[]", values=["change"]);
      __type = "case.investigation.completed"
          | event.kind := "alert"
          | array:append("event.category[]", values=["intrusion_detection"])
          | array:append("event.type[]", values=["info"])
          | event.outcome := "success";
      __type = "case.investigation.failed"
          | event.kind := "alert"
          | array:append("event.category[]", values=["intrusion_detection"])
          | array:append("event.type[]", values=["error"])
          | event.outcome := "failure";
      __type = /^risk\.(user|ai_user|ai_app|ai_mcp)\.threshold_exceeded$/
          | event.kind := "alert"
          | array:append("event.category[]", values=["threat"])
          | array:append("event.type[]", values=["indicator"]);
      __type = /^risk\.(user|ai_user|ai_app|ai_mcp)\.investigation\.completed$/
          | event.kind := "alert"
          | array:append("event.category[]", values=["threat"])
          | array:append("event.type[]", values=["info"]);
      __type = /^risk\.ai_(user|app|mcp)\.scored$/
          | event.kind := "event"
          | array:append("event.category[]", values=["threat"])
          | array:append("event.type[]", values=["info"]);
      *;
  }

  | case {
      // Fallback so event.category/event.type are never left empty (e.g. unrecognized/empty rawstring)
      event.category[0] = *
          | *;
      *
          | array:append("event.category[]", values=["network"])
          | array:append("event.type[]", values=["info"]);
  }

  // Client Fields
  | client.address := Vendor.userip
  | client.domain := lower(Vendor.domain)
  | client.packets := Vendor.client_packets
  | client.user.id := coalesce([Vendor.user_id, Vendor.data.user_id, Vendor.data.data.user_id])

  | case {
      // client.address and client.ip - validate whether value is an IP before normalizing
      cidr(field="client.address", subnet=["0.0.0.0/0", "::/0"])
          | client.ip := client.address;
      *;
  }

  | case {
      // client.bytes
      Vendor.client_bytes > 0
          | client.bytes := Vendor.client_bytes;
      *;
  }

  // Destination Fields
  | destination.address := coalesce([Vendor.dstip,Vendor.dsthost])
  | destination.port := Vendor.dstport
  | destination.geo.postal_code := Vendor.dst_zipcode
  | destination.geo.region_name := Vendor.dst_region
  | destination.geo.country_iso_code := Vendor.dst_country
  | destination.geo.city_name := Vendor.dst_location
  | destination.geo.timezone := Vendor.dst_timezone
  | splitString(by="\\|", field=Vendor.dst_longitude, as="destination.geo.location.lon", index=0)

  | case {
      // destination.geo.location.lat
      Vendor.dst_latitude = /\|/
          | splitString(by="\\|", field=Vendor.dst_latitude, as="destination.geo.location.lat", index=1);
      *
          | destination.geo.location.lat := Vendor.dst_latitude
  }

  | case {
      // destination.address and destination.ip - validate whether value is an IP before normalizing
      cidr(field="destination.address", subnet=["0.0.0.0/0", "::/0"])
          | destination.ip := destination.address;

      *;
  }

  // Device Fields
  | device.id := Vendor.device_id
  | device.manufacturer := Vendor.device_type

  | case {
      // device.model.name
      Vendor.device = *
          | device.model.name := Vendor.device;
      Vendor.device_name = *
          | device.model.name := Vendor.device_name;
      *;
  }

  // Event Fields
  | event.id := coalesce([Vendor.id, Vendor.data.id])
  | event.action := coalesce([Vendor.activity,Vendor.action,__type])
  | event.action := lower(event.action)
  | event.reason := concatArray(Vendor.supporting_data.data_values, separator=",")
  | event.reason := coalesce([event.reason, Vendor.data.data.summary, Vendor.data.summary, Vendor.summary, Vendor.data.data.error, Vendor.data.error, Vendor.error, Vendor.data.data.risk_note, Vendor.data.risk_note, Vendor.risk_note])
  | event.end := Vendor.end_time
  | event.start := Vendor.start_time
  | event.risk_score := coalesce([Vendor.data.data.risk_score, Vendor.data.risk_score, Vendor.risk_score, Vendor.data.data.score, Vendor.data.score, Vendor.score])

  | Vendor.action match {
      // event.outcome
      in(values=["allow", "accept", "permit", "bypass", "alert"], ignoreCase=true) =>
          event.outcome := "success";
      in(values=["block", "deny", "drop", "quarantine"], ignoreCase=true) =>
          event.outcome := "failure";
      * => *;
  }

  | __severity := coalesce([Vendor.severity, Vendor.data.data.severity, Vendor.data.severity, Vendor.data.data.band, Vendor.data.band, Vendor.band])

  | __severity match {
      // event.severity
      /^critical$/i =>
          event.severity := "90";
      /^high$/i =>
          event.severity := "70";
      /^medium$/i =>
          event.severity := "50";
      /^low$/i =>
          event.severity := "30";
      /^informational$/i =>
          event.severity := "10";
      * => *;
  }
  | drop([__severity])

  // File Fields
  | file.hash.sha256 := lower(Vendor.sha256)
  | file.hash.md5 := coalesce([Vendor.md5, Vendor.data.data.file_lineage.files[0].md5, Vendor.data.file_lineage.files[0].md5, Vendor.file_lineage.files[0].md5])
  | file.hash.md5 := lower(file.hash.md5)
  | file.path := Vendor.destination_file_path
  | file.size := Vendor.file_size
  | file.mime_type := Vendor.file_type

  | case {
      Vendor.object_type = "File"
          | Vendor.object = /("|!)?(?<file.name>.*)(")?/;

      *;

  }

  // Host Fields
  | host.hostname := lower(Vendor.hostname)

  | Vendor.os match {
      // host.os.type
      /win/i => host.os.type := "windows";
      /lin/i => host.os.type := "linux";
      /mac/i => host.os.type := "macos";
      /ios/i => host.os.type := "ios";
      /android/i => host.os.type := "android";
      * => *;
  }

  // HTTP Fields
  | http.request.referrer := Vendor.referer

  // Network Fields
  | network.application := lower(Vendor.app)
  | network.bytes := Vendor.numbytes
  | network.protocol := lower(Vendor.protocol)
  | regex("(?<network.protocol>[a-z]+)", field=network.protocol, strict=false)
  | network.transport := lower(Vendor.ip_protocol)

  // Organization Fields
  | organization.id := coalesce([Vendor.CustomerId, Vendor.tenant_id, Vendor.data.tenant_id])

  // Rule Fields
  | rule.name := Vendor.policy
  | rule.id := coalesce([Vendor.data.data.rule_ids[0], Vendor.data.rule_ids[0], Vendor.rule_ids[0]])

  // Service Fields
  | service.name := coalesce([Vendor.data.data.app_name, Vendor.data.app_name, Vendor.app_name, Vendor.data.data.mcp_server_name, Vendor.data.mcp_server_name, Vendor.mcp_server_name])
  | service.id := coalesce([Vendor.data.data.app_id, Vendor.data.app_id, Vendor.app_id, Vendor.data.data.mcp_server_id, Vendor.data.mcp_server_id, Vendor.mcp_server_id])

  // Server Fields
  | server.bytes := Vendor.server_bytes
  | server.packets := Vendor.server_packets

  // Source Fields
  | source.address := Vendor.srcip
  | source.port := Vendor.srcport
  | source.geo.postal_code := Vendor.src_zipcode
  | source.geo.region_name := Vendor.src_region
  | source.geo.country_iso_code := Vendor.src_country
  | source.geo.city_name := Vendor.src_location
  | source.geo.timezone := Vendor.src_timezone
  | splitString(by="\\|", field=Vendor.src_longitude, as="source.geo.location.lon", index=0)

  | case {
      // source.geo.location.lat
      Vendor.src_latitude = /\|/
          | splitString(by="\\|", field=Vendor.src_latitude, as="source.geo.location.lat", index=1);
      *
          | source.geo.location.lat := Vendor.src_latitude
  }

  | case {
      // source.address and source.ip - validate whether value is an IP before normalizing
      cidr(field="source.address", subnet=["0.0.0.0/0", "::/0"])
          | source.ip := source.address;
      *;
  }

  // URL Fields
  | url.original := coalesce([Vendor.url, Vendor.data.data.url, Vendor.data.url])
  | parseUri(field=url.original, defaultBase="//", prefix="url")
  | url.domain := rename(url.host)
  | url.domain := lower(url.domain)

  // User Fields
  | user.name := coalesce([Vendor.user, Vendor.ur_normalized, Vendor.data.data.user, Vendor.data.user, Vendor.data.data.user_name, Vendor.data.user_name, Vendor.user_name])

  // User Agent Fields
  | user_agent.original := Vendor.useragent

  // Threat Fields
  | case {
      threat.technique.subtechnique.id[0] = /[0-9T]+\.[0-9]+/i
          | match(file="epp/lookups/MitreMappings-ecs.csv", field=threat.technique.subtechnique.id[0], column=threat.technique.id[0], mode=glob, ignoreCase=true, include= ["threat.framework","threat.tactic.id[0]","threat.tactic.name[0]","threat.technique.id[0]","threat.technique.name[0]","threat.technique.reference[0]"]);
      threat.technique.id[0] = /[0-9T]+(\.[0-9]+)?/i
          | match(file="epp/lookups/MitreMappings-ecs.csv", field=threat.technique.id[0], column=threat.technique.id[0], mode=glob, ignoreCase=true, include= ["threat.framework","threat.tactic.id[0]","threat.tactic.name[0]","threat.technique.id[0]","threat.technique.name[0]","threat.technique.reference[0]"]);
      *;
  }

  | replace("\\.[0-9]{3}", with="", field=threat.technique.id[0])

  // #endregion

  // #region POST-NORMALIZATION
  /************************************************************
  ****** Post Normalization
  ****** Custom parser logic needed after normalization
  ************************************************************/

  | drop([__type])

  // #endregion
tagFields:
- Vendor
- Cps.version
- ecs.version
- event.kind
- event.module
- event.outcome
- event.dataset
- observer.type
